<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Join the Rebase Discord community.">
  <meta name="theme-color" content="#5865f2">
  <title>Join Rebase — Discord</title>

  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    :root {
      color-scheme: dark;
      --bg: #08090c;
      --card: rgba(19, 21, 27, .82);
      --card-2: rgba(255,255,255,.035);
      --border: rgba(255,255,255,.09);
      --text: #f5f7fa;
      --muted: #9ca3af;
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --success: #57f287;
      --danger: #ed4245;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -15%, rgba(88,101,242,.25), transparent 42%),
        radial-gradient(circle at 100% 100%, rgba(88,101,242,.08), transparent 35%),
        var(--bg);
    }

    .container { width: min(100%, 720px); }

    .brand { text-align: center; margin-bottom: 24px; }

    .brand-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 17px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: linear-gradient(145deg, #5865f2, #7289da);
      box-shadow: 0 18px 55px rgba(88,101,242,.25);
      font-size: 27px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 44px);
      line-height: 1.05;
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--card);
      box-shadow: 0 30px 90px rgba(0,0,0,.38);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .content { padding: 30px; }

    .intro { margin-bottom: 25px; }

    .intro h2 {
      margin: 0 0 8px;
      font-size: 20px;
      letter-spacing: -.02em;
    }

    .intro p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .agreements { display: grid; gap: 10px; }

    .agreement {
      position: relative;
      display: flex;
      gap: 13px;
      align-items: flex-start;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--card-2);
      cursor: pointer;
      transition: .15s ease;
    }

    .agreement:hover {
      background: rgba(255,255,255,.055);
      border-color: rgba(255,255,255,.16);
    }

    .agreement:has(input:checked) {
      border-color: rgba(87,242,135,.32);
      background: rgba(87,242,135,.045);
    }

    .agreement input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .box {
      flex: 0 0 22px;
      width: 22px;
      height: 22px;
      margin-top: 1px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 7px;
      color: transparent;
      transition: .15s ease;
    }

    .agreement input:checked + .box {
      color: #07110a;
      background: var(--success);
      border-color: var(--success);
    }

    .agreement-title {
      display: block;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.4;
    }

    .agreement-description {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    a {
      color: #aeb6ff;
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    .status {
      display: none;
      align-items: center;
      gap: 9px;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.45;
    }

    .status.show { display: flex; }

    .status.loading {
      color: #d4d7ff;
      border: 1px solid rgba(88,101,242,.22);
      background: rgba(88,101,242,.1);
    }

    .status.error {
      color: #ffb4b4;
      border: 1px solid rgba(237,66,69,.22);
      background: rgba(237,66,69,.1);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 21px 30px;
      border-top: 1px solid var(--border);
      background: rgba(0,0,0,.12);
    }

    .note {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .note i { margin-top: 2px; }

    button {
      flex: 0 0 auto;
      min-height: 46px;
      padding: 0 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: .15s ease;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) { transform: translateY(0); }

    button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      body { padding: 18px 12px; }
      .content { padding: 22px; }
      .footer { flex-direction: column; align-items: stretch; padding: 18px 22px; }
      button { width: 100%; }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="brand">
      <div class="brand-icon" aria-hidden="true">
        <i class="fa-brands fa-discord"></i>
      </div>
      <h1>Join Rebase</h1>
      <p class="subtitle">Read the rules before joining our Discord community.</p>
    </header>

    <section class="card" aria-labelledby="before-join">
      <div class="content">
        <div class="intro">
          <h2 id="before-join">Before you join</h2>
          <p>
            Please read the following documents carefully. You must agree to
            all required documents before joining the Rebase Discord server.
          </p>
        </div>

        <div class="agreements">
          <label class="agreement">
            <input id="tos" type="checkbox">
            <span class="box" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
            <span>
              <span class="agreement-title">I agree to the Rebase Terms of Service.</span>
              <span class="agreement-description">
                I have read and agree to follow the Rebase Terms of Service.
              </span>
            </span>
          </label>

          <label class="agreement">
            <input id="minecraftEula" type="checkbox">
            <span class="box" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
            <span>
              <span class="agreement-title">I agree to follow the Minecraft EULA.</span>
              <span class="agreement-description">
                I understand that Rebase-related Minecraft projects must comply with
                <a href="https://www.minecraft.net/en-us/eula" target="_blank" rel="noopener noreferrer">the Minecraft EULA</a>.
              </span>
            </span>
          </label>

          <label class="agreement">
            <input id="rules" type="checkbox">
            <span class="box" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
            <span>
              <span class="agreement-title">I agree to follow the Rebase Rules.</span>
              <span class="agreement-description">
                I have read and agree to follow the rules of the Rebase community.
              </span>
            </span>
          </label>
        </div>

        <div id="status" class="status" role="status" aria-live="polite"></div>
      </div>

      <footer class="footer">
        <div class="note">
          <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
          <span>A unique, single-use Discord invite will be generated when you continue.</span>
        </div>

        <button id="joinButton" type="button" disabled>
          <i class="fa-brands fa-discord" aria-hidden="true"></i>
          <span>Join Discord</span>
        </button>
      </footer>
    </section>
  </main>

  <script>
    const API_URL = "https://discord.intensed.workers.dev/create-invite";

    const tos = document.getElementById("tos");
    const minecraftEula = document.getElementById("minecraftEula");
    const rules = document.getElementById("rules");
    const joinButton = document.getElementById("joinButton");
    const status = document.getElementById("status");

    const allAccepted = () =>
      tos.checked && minecraftEula.checked && rules.checked;

    function updateButton() {
      joinButton.disabled = !allAccepted();
    }

    function showStatus(message, type) {
      status.className = "status show " + type;
      status.innerHTML = `
        <i class="fa-solid ${type === "error" ? "fa-circle-exclamation" : "fa-circle-notch fa-spin"}"></i>
        <span></span>
      `;
      status.querySelector("span").textContent = message;
    }

    [tos, minecraftEula, rules].forEach((checkbox) => {
      checkbox.addEventListener("change", updateButton);
    });

    joinButton.addEventListener("click", async () => {
      if (!allAccepted()) return;

      joinButton.disabled = true;
      joinButton.innerHTML = `
        <i class="fa-solid fa-circle-notch fa-spin"></i>
        <span>Creating invite...</span>
      `;
      showStatus("Creating your single-use Discord invite...", "loading");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            tos: true,
            minecraftEula: true,
            rules: true
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success || !data.invite) {
          throw new Error(data.error || "Could not create a Discord invite.");
        }

        showStatus("Invite created. Redirecting to Discord...", "loading");
        window.location.assign(data.invite);
      } catch (error) {
        console.error(error);
        showStatus(error.message || "Something went wrong. Please try again.", "error");
        joinButton.disabled = !allAccepted();
        joinButton.innerHTML = `
          <i class="fa-brands fa-discord"></i>
          <span>Join Discord</span>
        `;
      }
    });

    updateButton();
  </script>
</body>
</html>
